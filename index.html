<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حُسبان الإسلامي">
<title>ساعة حُسبان الإسلامية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Roboto:wght@300;400&display=swap">
<style>
/* Islamic model of ساعة حُسبان: white clock face, current prayer with elapsed time, prayer list, qibla, city picker.
   Same solar engine (hisban-core.js) and same countries/cities as the main clock. */
:root{
  --bg:#ffffff; --ink:#1c1f23; --muted:#8e959c; --soft:#f3f5f7; --line:#e7eaee;
  --blue:#2aa7d8; --teal:#1d4e5f; --gold:#c9972e;
  --face:#ffffff; --shadow:rgba(30,40,60,.10);
  --body:"Cairo","Segoe UI",Tahoma,sans-serif;
  --num:"Roboto","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;justify-content:flex-start;padding-top:env(safe-area-inset-top,0px)}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.iconbtn:focus-visible,.tab:focus-visible,.item:focus-visible,.pbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.place{text-align:center;margin:18px 0 4px}
.place h1{margin:0;font-weight:600;font-size:2rem;line-height:1.2;display:inline-flex;align-items:center;gap:10px}
.place p{margin:6px 0 0;color:var(--muted);font-size:1rem}
.view[hidden]{display:none}
/* clock */
.face{display:block;width:min(86vw,360px);margin:20px auto 0;filter:drop-shadow(0 18px 30px var(--shadow))}
#face{width:min(100%,440px);margin-top:8px}
.now{text-align:center;margin-top:22px}
.now .pr{color:var(--teal);font-size:2.2rem;font-weight:600;line-height:1.2}
.now .at{color:var(--muted);font-size:1.35rem;margin-top:6px;font-family:var(--num);direction:ltr;unicode-bidi:isolate}
.now .el{font-family:var(--num);font-weight:300;font-size:2.6rem;letter-spacing:.06em;margin-top:6px;direction:ltr;unicode-bidi:isolate}
.now .nx{color:var(--muted);font-size:.95rem;margin-top:4px}
.now .nx b{color:var(--ink);font-weight:600}
.data{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0 8px}
.cell{background:var(--soft);border-radius:16px;padding:10px 12px;text-align:center;min-width:0}
.cell span{display:block;color:var(--muted);font-size:.8rem}
.cell b{display:block;font-family:var(--num);font-weight:400;font-size:1.15rem;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.cell small{display:block;color:var(--muted);font-family:var(--num);font-size:.72rem;direction:ltr;white-space:nowrap}
.cell.wide{grid-column:1/-1}
.cell .hb{color:var(--gold);font-size:1.5rem}
.dates{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:6px 4px 0}
/* prayer list */
.list{margin-top:18px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--soft)}
.row .n{font-weight:600;font-size:1.1rem}
.row .t{font-family:var(--num);font-size:1.15rem;direction:ltr;unicode-bidi:isolate}
.row .a{font-family:var(--num);color:var(--gold);font-size:.85rem;direction:ltr;unicode-bidi:isolate;min-width:84px;text-align:left}
.row.on{background:var(--blue);color:#fff}.row.on .a{color:#fff}
.row.sun .n{color:var(--muted);font-weight:400}
.opts{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.pbtn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin:10px 8px 0;line-height:1.7}
/* qibla */
.qb{text-align:center;margin-top:10px}
.qb .big{font-family:var(--num);font-size:2.4rem;font-weight:300;direction:ltr;unicode-bidi:isolate}
.qb .msg{color:var(--muted);margin-top:4px;min-height:1.6em}
.main{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:12px 26px;font-weight:600;cursor:pointer;margin-top:12px;font-size:1rem}
/* cities */
.grp{color:var(--muted);font-size:.85rem;margin:16px 4px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:start;cursor:pointer;font-weight:600;font-size:.98rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.item.on{border-color:var(--blue);color:var(--blue)}
.back{border:0;background:transparent;color:var(--blue);font-weight:600;cursor:pointer;padding:8px 0;font-size:1rem}
/* bottom tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;color:#a3a9b0;cursor:pointer;font-size:.72rem;padding:4px 10px;border-radius:12px}
.tab[aria-selected="true"]{color:var(--blue)}
.tab svg{width:30px;height:30px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="iconbtn" id="menu" aria-label="اختيار الدولة والمدينة">
    <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><path d="M2 4h30M10 15h22M18 26h14" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg></button></div>
  <div class="place"><h1><span id="city"></span>
    <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M6 2h14l-2 3v8l5 5H3l5-5V5z" fill="var(--blue)"/><path d="M13 18v11" stroke="var(--blue)" stroke-width="2.6" stroke-linecap="round"/></svg></h1>
    <p id="sub"></p></div>

  <!-- 1) clock -->
  <section class="view" id="v-clock">
    <svg class="face" id="face" viewBox="-72 -46 444 392" role="img" aria-label="قرص زاوية حُسبان"></svg>
    <div class="now" aria-live="polite">
      <div class="pr" id="prName">—</div>
      <div class="at" id="prAt">—</div>
      <div class="el" id="prEl">—</div>
      <div class="nx" id="prNext"></div>
    </div>
    <div class="data">
      <div class="cell wide"><span>زاوية حُسبان</span><b class="hb" id="hb">—</b></div>
      <div class="cell"><span>☀ الشروق</span><b id="rise">—</b><small id="riseU"></small></div>
      <div class="cell"><span>☾ الغروب</span><b id="set">—</b><small id="setU"></small></div>
      <div class="cell"><span id="pctL">مؤشر النهار</span><b id="pct">—</b></div>
      <div class="cell"><span>قوس النهار / الليل</span><b id="arcs" style="font-size:.95rem">—</b></div>
    </div>
    <div class="dates"><span id="greg"></span><span id="hijri"></span></div>
  </section>

  <!-- 2) prayer times -->
  <section class="view" id="v-list" hidden>
    <div class="list" id="list"></div>
    <div class="opts" role="group" aria-label="مذهب حساب العصر">
      <button class="pbtn" id="asr1" aria-pressed="true">العصر: الجمهور</button>
      <button class="pbtn" id="asr2" aria-pressed="false">العصر: الحنفي</button>
    </div>
    <p class="note" id="method"></p>
  </section>

  <!-- 3) qibla -->
  <section class="view" id="v-qibla" hidden>
    <svg class="face" id="qface" viewBox="0 0 300 300" role="img" aria-label="بوصلة القبلة"></svg>
    <div class="qb">
      <div class="big" id="qDeg">—</div>
      <div class="msg" id="qMsg">اضغط «تشغيل البوصلة» وضع الهاتف أفقيًا</div>
      <button class="main" id="qBtn">تشغيل البوصلة</button>
      <p class="note">البوصلة تعمل دون إنترنت من مستشعر الهاتف. ابتعد عن المعادن والسيارات لتصح القراءة.</p>
    </div>
  </section>

  <!-- 4) countries & cities -->
  <section class="view" id="v-world" hidden>
    <button class="back" id="back" hidden>→ كل الدول</button>
    <div id="world"></div>
  </section>
</div>

<nav class="tabs" role="tablist" aria-label="الأقسام">
  <button class="tab" role="tab" data-v="clock" aria-selected="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="16" cy="16" r="13"/><path d="M16 8v8l5 4" stroke-linecap="round"/></svg>الساعة</button>
  <button class="tab" role="tab" data-v="list" aria-selected="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 8h22M5 13h22M5 18h22M5 23h22"/></svg>المواقيت</button>
  <button class="tab" role="tab" data-v="world" aria-selected="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="16" cy="16" r="13"/><path d="M3 16h26M16 3c-6 7-6 19 0 26M16 3c6 7 6 19 0 26"/></svg>المدن</button>
  <button class="tab" role="tab" data-v="qibla" aria-selected="false"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="currentColor"/><path d="M21.5 10.5l-3.4 7.6-7.6 3.4 3.4-7.6z" fill="#fff"/></svg>القبلة</button>
</nav>

/* ---------- place: shares the country, city and GPS fix with the main clock ---------- */
const tzFmt={};
function tzOff(zone,lon){try{const f=tzFmt[zone]||(tzFmt[zone]=new Intl.DateTimeFormat("en-US",{timeZone:zone,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"}));
  const now=new Date(),p={};f.formatToParts(now).forEach(x=>p[x.type]=+x.value);
  return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute)-Math.floor(now.getTime()/6e4)*6e4)/6e4)/60}catch(e){return Math.round(lon/15)}}
let fix=loadFix();
let co=store.get("hisban-country");if(co==null||!CITY_DB[co])co=0;
let ci=store.get("hisban-ci");
function place(){const list=CITY_DB[co];
  if(ci==null||ci<0||ci>list.length||(ci===list.length&&!fix))ci=0;
  if(ci===list.length){const p=fixPos(fix);return{name:"موقعي الحالي",lat:p[0],lon:p[1],tz:devTz,mine:true}}
  const c=list[ci];return{name:c[0],lat:c[1],lon:c[2],tz:tzOff(c[3],c[2]),mine:false}}

/* ---------- prayer methods (twilight angles in degrees; ishaMin = fixed minutes after sunset) ---------- */
const MW=[18,17],METHODS={0:[18,17,"وزارة الشؤون الدينية الجزائرية"],1:[19,17,"وزارة الأوقاف المغربية"],2:[18,18,"تونس"],4:[19.5,17.5,"الهيئة المصرية للمساحة"],5:[19.5,17.5,"الهيئة المصرية"],
  7:[18.5,null,"أم القرى",90],10:[18.2,18.2,"الهيئة العامة للشؤون الإسلامية الإماراتية"],11:[18,null,"قطر",90],12:[18,17.5,"الكويت"],
  19:[15,15,"الجمعية الإسلامية لأمريكا الشمالية"],21:[15,15,"الجمعية الإسلامية لأمريكا الشمالية"],24:[18,18,"جامعة العلوم الإسلامية بكراتشي"],27:[20,18,"وزارة الشؤون الدينية الإندونيسية"]};
const method=()=>{const m=METHODS[co];return m?{fa:m[0],ia:m[1],name:m[2],ishaMin:m[3]}:{fa:MW[0],ia:MW[1],name:"رابطة العالم الإسلامي"}};
let hanafi=!!store.get("hisban-asr-hanafi");

function prayers(P,d){
  const S=sun(d,P.lat,P.lon,P.tz),la=P.lat*rad;
  const cosH=a=>(Math.sin(a*rad)-Math.sin(la)*Math.sin(S.dec))/(Math.cos(la)*Math.cos(S.dec));
  const ha=a=>{const c=cosH(a);return c<-1||c>1?null:Math.acos(c)*deg/15};
  const polar=cosH(-.833)>1?"night":cosH(-.833)<-1?"day":null;
  if(polar)return{S,polar};
  const m=method(),night=24-(S.set-S.rise);
  let fH=ha(-m.fa),fajr=fH!=null?S.noon-fH:S.rise-night*m.fa/60;          // high latitudes: angle-based share of the night
  let isha;if(m.ishaMin)isha=S.set+m.ishaMin/60;else{const iH=ha(-m.ia);isha=iH!=null?S.noon+iH:S.set+night*m.ia/60}
  const asrAlt=Math.atan(1/((hanafi?2:1)+Math.tan(Math.abs(la-S.dec))))*deg,aH=ha(asrAlt);
  const asr=aH!=null?S.noon+aH:(S.noon+S.set)/2;
  return{S,list:[["الفجر",fajr],["الشروق",S.rise,1],["الظهر",S.noon+1/60],["العصر",asr],["المغرب",S.set],["العشاء",isha]],m};
}

/* ---------- formatting ---------- */
const fmt12=h=>{h=((h%24)+24)%24;let m=Math.round(h*60)%1440,H=Math.floor(m/60),M=m%60;const ap=H<12?"ص":"م";H=H%12||12;return pad2(H)+":"+pad2(M)+" "+ap};
const fmtHMS=h=>{h=((h%24)+24)%24;const t=Math.round(h*3600)%86400;return pad2(Math.floor(t/3600))+":"+pad2(Math.floor(t%3600/60))+":"+pad2(t%60)};
const dur=h=>{const t=Math.max(0,Math.floor(h*3600));return pad2(Math.floor(t/3600))+" : "+pad2(Math.floor(t%3600/60))+" : "+pad2(t%60)};

/* ---------- clock face: same geometry and colours as ساعة حُسبان —
   top = بداية النهار (sunrise), right = منتصف النهار, bottom = بداية اليوم (sunset), left = منتصف الليل;
   the day fills the right half, the night the left half (dialA from the core) ---------- */
const C=(r,a)=>[150+r*Math.sin(a*rad),150-r*Math.cos(a*rad)];
const arcP=(r,a1,a2)=>{const s=C(r,a1),e=C(r,a2),span=((a2-a1)%360+360)%360;return`M${s[0].toFixed(1)} ${s[1].toFixed(1)}A${r} ${r} 0 ${span>180?1:0} 1 ${e[0].toFixed(1)} ${e[1].toFixed(1)}`};
const pill=(icon,sub,tm,a,c)=>{const[x,y]=C(a%180?172:178,a);return`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><rect x="-46" y="-19" width="92" height="38" rx="19" fill="#fff" stroke="${c}" stroke-width="1.4" style="filter:drop-shadow(0 2px 4px rgba(30,40,60,.08))"/><text text-anchor="middle" y="-2" fill="${c}" font-size="11" font-weight="700" font-family="Cairo,Tahoma">${icon} ${sub}</text><text text-anchor="middle" y="12" fill="#1c1f23" font-size="10" font-family="Roboto,Arial" direction="ltr">${tm}</text></g>`};
function drawFace(S,h,startT,marks,sec){
  const pos=t=>dialA(t,S),aN=pos(h),dayLen=S.set-S.rise,midnight=S.set+(24-dayLen)/2;
  let t=`<defs><linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1cf7a"/><stop offset="1" stop-color="#c9972e"/></linearGradient><linearGradient id="gN" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5b8fd9"/><stop offset="1" stop-color="#2c4a8a"/></linearGradient></defs>`;
  t+=`<circle cx="150" cy="150" r="140" fill="var(--face)"/>`;
  for(let a=0;a<360;a+=30){if(a===90||a===270)continue;const[x,y]=C(117,a);t+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="#9aa0a6" font-size="12" font-family="Roboto,Arial" direction="ltr">${a}°</text>`}
  t+=`<path d="${arcP(140,0.5,179.5)}" fill="none" stroke="url(#gD)" stroke-opacity=".28" stroke-width="7"/><path d="${arcP(140,180.5,359.5)}" fill="none" stroke="url(#gN)" stroke-opacity=".28" stroke-width="7"/>`;
  // elapsed part of the current half (day or night), full colour
  t+=aN<180?`<path d="${arcP(140,0.5,Math.max(aN,0.6))}" fill="none" stroke="url(#gD)" stroke-width="7" stroke-linecap="round"/>`:`<path d="${arcP(140,180.5,Math.max(aN,180.6))}" fill="none" stroke="url(#gN)" stroke-width="7" stroke-linecap="round"/>`;
  t+=`<circle cx="150" cy="150" r="96" fill="#fff" style="filter:drop-shadow(0 4px 10px rgba(30,40,60,.10))"/>`;
  if(startT!=null)t+=`<path d="${arcP(126,pos(startT),aN)}" fill="none" stroke="var(--blue)" stroke-width="3.5" stroke-linecap="round"/>`;
  marks.forEach(([tm,on])=>{const[x,y]=C(126,pos(tm));t+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?4.5:3}" fill="${on?"var(--blue)":"#c7ccd1"}"/>`});
  const[hx,hy]=C(80,aN),[tx,ty]=C(-14,aN),[sx,sy]=C(88,sec*6),[bx,by]=C(-22,sec*6),[mx,my]=C(140,aN);
  t+=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="7" fill="#fff" stroke="${aN<180?"#c9972e":"#2c4a8a"}" stroke-width="3"/>`;
  t+=`<line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#111" stroke-width="7" stroke-linecap="round"/>`;
  t+=`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round"/>`;
  t+=`<circle cx="150" cy="150" r="4" fill="#111"/>`;
  t+=pill("☀","بداية النهار",fmt(S.rise),0,"#c9972e")+pill("◑","منتصف النهار",fmt(S.noon),90,"#c9972e")+pill("☾","بداية اليوم",fmt(S.set),180,"#2c4a8a")+pill("✦","منتصف الليل",fmt(midnight),270,"#2c4a8a");
  $("face").innerHTML=t;
}

    COUNTRY_NAMES.map((n,i)=>n[1]===gi?`<button class="item${i===co?" on":""}" data-co="${i}">${n[0]}<small>${CITY_DB[i].length} ${CITY_DB[i].length>10?"مدينة":"مدن"}</small></button>`:"").join("")+`</div>`).join("");return}
  w.innerHTML=`<div class="grp">${COUNTRY_NAMES[c][0]}: اختر المدينة</div><div class="grid">`+CITY_DB[c].map((x,k)=>`<button class="item${c===co&&k===ci?" on":""}" data-ci="${k}" data-c="${c}">${x[0]}</button>`).join("")+
    `<button class="item" data-gps="${c}">📍 موقعي الحالي<small>GPS</small></button></div><p class="note" id="gpsMsg"></p>`}
$("back").onclick=()=>renderWorld(null);
$("world").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.co!=null){renderWorld(+b.dataset.co);scrollTo(0,0);return}
  if(b.dataset.gps!=null){const c=+b.dataset.gps;if(!navigator.geolocation){$("gpsMsg").textContent="الهاتف لا يدعم تحديد الموقع.";return}
    $("gpsMsg").textContent="جارٍ تحديد موقعك…";
    navigator.geolocation.getCurrentPosition(p=>{fix=freshFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy,"gps");store.set("hisban-fix",fix);
      co=c;ci=CITY_DB[c].length;store.set("hisban-country",co);store.set("hisban-ci",ci);show("clock")},
      ()=>{$("gpsMsg").textContent="تعذّر تحديد الموقع. تأكد من تفعيل GPS والسماح للمتصفح."},{enableHighAccuracy:true,timeout:20000});return}
  co=+b.dataset.c;ci=+b.dataset.ci;store.set("hisban-country",co);store.set("hisban-ci",ci);show("clock")});

/* asr school */
function setAsr(h){hanafi=h;store.set("hisban-asr-hanafi",h);$("asr1").setAttribute("aria-pressed",!h);$("asr2").setAttribute("aria-pressed",h);tick()}
$("asr1").onclick=()=>setAsr(false);$("asr2").onclick=()=>setAsr(true);setAsr(hanafi);

/* qibla */
let qOn=false;
async function qToggle(){if(qOn){qOn=false;oriStop("qibla");$("qBtn").textContent="تشغيل البوصلة";return}
  if(!(await sensorPermission(false))){$("qMsg").textContent="لم يُسمح باستخدام مستشعر الاتجاه.";return}
  qOn=true;oriStart("qibla");$("qBtn").textContent="إيقاف البوصلة";$("qMsg").textContent="انتظر قراءة المستشعر…"}
$("qBtn").onclick=qToggle;
function drawQibla(P){const q=bearing(P.lat,P.lon,KAABA[0],KAABA[1]),km=distM(P.lat,P.lon,KAABA[0],KAABA[1])/1000;
  const rot=qOn&&heading!=null?-heading:0;
  let t=`<circle cx="150" cy="150" r="140" fill="#fff"/><g transform="rotate(${rot.toFixed(1)} 150 150)">`;
  for(let a=0;a<360;a+=10){const[x1,y1]=C(136,a),[x2,y2]=C(a%30?130:124,a);t+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#c7ccd1" stroke-width="${a%30?1:2}"/>`}
  [["ش",0,"#d64545"],["ق",90,"#9aa0a6"],["ج",180,"#9aa0a6"],["غ",270,"#9aa0a6"]].forEach(([l,a,c])=>{const[x,y]=C(108,a);t+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="${c}" font-family="Cairo,Tahoma">${l}</text>`});
  const[kx,ky]=C(92,q);t+=`<line x1="150" y1="150" x2="${kx.toFixed(1)}" y2="${ky.toFixed(1)}" stroke="var(--blue)" stroke-width="5" stroke-linecap="round"/><rect x="${(kx-9).toFixed(1)}" y="${(ky-9).toFixed(1)}" width="18" height="18" rx="3" fill="#111" transform="rotate(${q.toFixed(1)} ${kx.toFixed(1)} ${ky.toFixed(1)})"/></g>`;
  t+=`<path d="M150 4l8 14h-16z" fill="#111"/><circle cx="150" cy="150" r="5" fill="#111"/>`;
  $("qface").innerHTML=t;$("qDeg").textContent=q.toFixed(1)+"°";
  if(qOn&&heading!=null){const d=((q-heading+540)%360)-180;$("qMsg").textContent=Math.abs(d)<3?"✓ أنت متجه نحو القبلة":`أدِر الهاتف ${d>0?"يمينًا":"يسارًا"} ${Math.abs(d).toFixed(0)}° · المسافة إلى مكة ${Math.round(km).toLocaleString("ar")} كم`}
  else if(!qOn)$("qMsg").textContent=`اتجاه القبلة من الشمال الحقيقي · المسافة إلى مكة ${Math.round(km).toLocaleString("ar")} كم`}

/* ---------- main loop ---------- */
function tick(){
  if(fix){fix=loadFix()||fix}
  const P=place(),{d,h}=localNow(P.tz),R=prayers(P,d),S=R.S;
  $("city").textContent=P.name;
  $("sub").textContent=COUNTRY_NAMES[co][0]+" · "+(P.mine?(fix&&fix.src==="gps"?"موقع GPS":"الموقع مثبت يدويًا"):"مدينة مختارة");
  const ld=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  $("greg").textContent=new Intl.DateTimeFormat("ar-DZ-u-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(ld);
  try{$("hijri").textContent=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(ld)}catch(e){}
  const hb=husban(h,S.rise),sec=new Date().getSeconds();
  $("hb").textContent=hb.toFixed(4)+"°";
  $("rise").textContent=fmtHMS(S.rise);$("set").textContent=fmtHMS(S.set);
  $("riseU").textContent="UTC "+fmtHMS(S.rise-P.tz);$("setU").textContent="UTC "+fmtHMS(S.set-P.tz);
  const dayLen=S.set-S.rise,isDay=h>=S.rise&&h<S.set;
  const pct=isDay?(h-S.rise)/dayLen:(((h-S.set)%24+24)%24)/(24-dayLen);
  $("pctL").textContent=isDay?"مضى من نهارك":"مضى من ليلك";$("pct").textContent=Math.round(pct*100)+"%";
  $("arcs").textContent=(dayLen*15).toFixed(4)+"° / "+((24-dayLen)*15).toFixed(4)+"°";
  if(R.polar){$("prName").textContent=R.polar==="night"?"ليل قطبي":"نهار قطبي";$("prAt").textContent="الشمس لا "+(R.polar==="night"?"تشرق":"تغرب")+" اليوم";$("prEl").textContent="—";$("prNext").textContent="";
    drawFace(S,h,null,[],sec);$("list").innerHTML=`<p class="note">لا تتوفر مواقيت محسوبة في الليل أو النهار القطبي.</p>`;$("method").textContent="";if(view==="qibla")drawQibla(P);return}
  const L=R.list;let cur=-1;L.forEach((p,i)=>{if(h>=p[1])cur=i});
  const curP=cur<0?["العشاء",L[5][1]-24]:L[cur],nxt=cur<0?L[0]:cur<5?L[cur+1]:["الفجر",L[0][1]+24];
  $("prName").textContent=curP[0];$("prAt").textContent=fmt12(curP[1]);$("prEl").textContent="+ "+dur(h-curP[1]);
  $("prNext").innerHTML=`التالي: <b>${nxt[0]}</b> بعد <span class="num" dir="ltr">${dur(nxt[1]-h).replace(/ /g,"")}</span>`;
  drawFace(S,h,curP[1],L.map((p,i)=>[p[1],i===cur]),sec);
  if(view==="list"){$("list").innerHTML=L.map((p,i)=>`<div class="row${i===cur?" on":""}${p[2]?" sun":""}"><span class="n">${p[0]}</span><span class="t">${fmt12(p[1])}</span><span class="a">${husban(p[1],S.rise).toFixed(4)}°</span></div>`).join("");
    $("method").textContent=`الحساب: ${R.m.name} — الفجر عند ${R.m.fa}° تحت الأفق، والعشاء ${R.m.ishaMin?`بعد المغرب بـ ${R.m.ishaMin} دقيقة`:`عند ${R.m.ia}°`}. حساب فلكي من الهاتف دون إنترنت؛ قد يختلف دقيقة أو دقيقتين عن التقويم الرسمي.`}
  if(view==="qibla")drawQibla(P);
}
tick();setInterval(tick,1000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
